name: Build IPA from your own Spotify IPA

on:
  push:
    branches: [fix/yanbi-adaptive-notch-performance]
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos
  IPA_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.ipa_url || 'https://files.catbox.moe/qa5eyg.ipa' }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        run: |
          mkdir -p ipa
          curl --fail --show-error --silent --location --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 1500 --proto '=https' --proto-redir '=https' "$IPA_URL" -o ipa/spotify.ipa
          test -s ipa/spotify.ipa || { echo "::error::The Spotify IPA download was empty"; exit 1; }
          unzip -tq ipa/spotify.ipa >/dev/null || { echo "::error::Invalid ZIP/IPA archive"; exit 1; }
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - run: make release

      - name: Verify IPA assets
        run: |
          python3 - <<'PY'
          import glob, zipfile, hashlib, pathlib
          files = glob.glob('out/*.ipa')
          assert files, 'No IPA created'
          portrait = pathlib.Path('extension/LiveActivity/yanbi-avatar.jpg').read_bytes()
          for file in files:
              with zipfile.ZipFile(file) as ipa:
                  assert ipa.testzip() is None
                  app = [n for n in ipa.namelist() if n.startswith('Payload/') and n.endswith('.app/yanbi-avatar.jpg') and n.count('/') == 2]
                  widget = [n for n in ipa.namelist() if n.endswith('.appex/yanbi-avatar.jpg')]
                  assert len(app) == 1 and len(widget) == 1, (app, widget)
                  assert ipa.read(app[0]) == portrait and ipa.read(widget[0]) == portrait
                  dylibs = [n for n in ipa.namelist() if n.endswith('/spotifyglass.dylib')]
                  assert dylibs and b'SGYanbiIslandCoordinator' in ipa.read(dylibs[0])
                  print(file, 'archive and portrait verified', hashlib.sha256(portrait).hexdigest())
          PY

      - uses: actions/upload-artifact@v5
        if: github.event_name == 'push' || inputs.upload_method != 'filebin'
        with:
          name: vitrine.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: github.event_name == 'workflow_dispatch' && inputs.upload_method != 'artifacts'
        run: |
          BIN="vitrine-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
